name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all shell scripts
        run: |
          find . -name "*.sh" -not -path "./nvim/*" -not -path "./.git/*" -print0 |
            xargs -0 shellcheck -S error

  zsh-syntax:
    name: Zsh/Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check zsh syntax (parse only, no execution)
        run: |
          for f in zsh/zshrc zsh/aliases zsh/aliases.zsh zsh/functions zsh/p10k.zsh; do
            echo "Checking $f"
            zsh -n "$f"
          done

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: |
          find . \( -name "*.yaml" -o -name "*.yml" \) -not -path "./nvim/*" -not -path "./.git/*" -print0 |
            xargs -0 yamllint -d relaxed

  brewfile-check:
    name: Brewfile name validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap all taps referenced in Brewfile
        run: |
          sed -n 's/^tap "\([^"]*\)".*/\1/p' Brewfile | sort -u > /tmp/taps.txt
          while read -r t; do
            brew tap "$t" || echo "::error::tap \"$t\" failed to add"
          done < /tmp/taps.txt
      - name: Verify every brew/cask entry resolves to a real formula/cask
        run: |
          # Short-name lookup can miss formulas from a tap added moments ago
          # (name-resolution cache isn't warm yet), so fall back to checking
          # every tapped repo explicitly by fully-qualified name.
          resolves() {
            local kind=$1 name=$2
            brew info "--$kind" "$name" >/dev/null 2>&1 && return 0
            while read -r t; do
              brew info "--$kind" "$t/$name" >/dev/null 2>&1 && return 0
            done < /tmp/taps.txt
            return 1
          }
          fail=0
          while read -r name; do
            resolves formula "$name" || {
              echo "::error::brew \"$name\" does not resolve to a known formula"
              fail=1
            }
          done < <(sed -n 's/^brew "\([^"]*\)".*/\1/p' Brewfile)
          while read -r name; do
            resolves cask "$name" || {
              echo "::error::cask \"$name\" does not resolve to a known cask"
              fail=1
            }
          done < <(sed -n 's/^cask "\([^"]*\)".*/\1/p' Brewfile)
          exit $fail
